user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format security '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" upstream=$upstream_addr';
    access_log /dev/stdout security;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    limit_req_zone $binary_remote_addr zone=global_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=authentication_per_ip:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream sge_api {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        return 308 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        limit_conn connections_per_ip 20;

        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"Healthy"}';
        }

        location = /api/auth/login {
            limit_req zone=global_per_ip burst=40 nodelay;
            limit_req zone=authentication_per_ip burst=5 nodelay;
            include /etc/nginx/proxy-common.conf;
        }

        location = /api/auth/refresh {
            limit_req zone=global_per_ip burst=40 nodelay;
            limit_req zone=authentication_per_ip burst=5 nodelay;
            include /etc/nginx/proxy-common.conf;
        }

        location / {
            limit_req zone=global_per_ip burst=40 nodelay;
            include /etc/nginx/proxy-common.conf;
        }
    }
}
