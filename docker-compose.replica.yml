# Overlay opcional: instância secundária do SQL Server em espera (standby) para
# replicação síncrona via Always On (read-scale, CLUSTER_TYPE = NONE).
#
# Uso (sem o override local de desenvolvimento):
#   docker compose -f docker-compose.yml -f docker-compose.replica.yml up -d
#
# Depois de a pilha ficar saudável, configure o grupo de disponibilidade uma vez:
#   wsl bash scripts/configure-availability-group.sh
#
# A réplica NÃO substitui o backup. Ela reduz a janela de perda em falha do
# primário e permite failover manual documentado. Ambas as instâncias usam
# armazenamento persistente independente e conversam apenas pela rede interna.
# Nenhuma porta nova é publicada no host.

services:
  # HADR precisa estar habilitado no primário e a instância reiniciada. Aplicar
  # este overlay recria o container `sqlserver` uma vez para injetar a variável.
  sqlserver:
    environment:
      MSSQL_ENABLE_HADR: "1"

  sqlserver-replica:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_ENABLE_HADR: "1"
      # Senha SA própria da réplica; nunca reutilize a do primário.
      MSSQL_SA_PASSWORD: ${SGE_SQLSERVER_REPLICA_SA_PASSWORD:?Defina SGE_SQLSERVER_REPLICA_SA_PASSWORD}
    volumes:
      - sql-replica-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    networks:
      # Somente a rede interna do Compose; o endpoint de espelhamento (5022) fica
      # acessível apenas entre containers, sem binding no host.
      default:

volumes:
  # Armazenamento persistente independente do volume `sql-data` do primário.
  sql-replica-data:
