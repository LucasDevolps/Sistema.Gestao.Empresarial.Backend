name: backend-deploy-iis

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: backend-deploy-iis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-iis:
    name: Publish to local IIS
    runs-on: [self-hosted, sge-backend]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bring up dev stack (Docker/WSL)
        shell: pwsh
        run: ./scripts/dev-up.ps1 -SkipFrontend

      - name: Publish to IIS
        shell: powershell
        run: .\scripts\publish-local-iis.ps1 -Action Publish
