name: backend-ci

on:
  push:
    branches: [main, master, develop, "feature/**", "feat/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, tests and images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SGE_RABBITMQ_USERNAME: sge_ci
      SGE_SQLSERVER_APP_USERNAME: sge_app_ci
      SGE_REDIS_USERNAME: sge_cache_ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize ephemeral CI credentials
        shell: bash
        run: |
          sql_password="Ci!$(openssl rand -hex 24)aA1"
          rabbit_password="$(openssl rand -hex 24)"
          app_sql_password="Ci!$(openssl rand -hex 24)aA1"
          redis_password="$(openssl rand -hex 32)"
          jwt_key="$(openssl rand -hex 32)"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$rabbit_password"
          echo "::add-mask::$app_sql_password"
          echo "::add-mask::$redis_password"
          echo "::add-mask::$jwt_key"
          {
            echo "SGE_SQLSERVER_SA_PASSWORD=$sql_password"
            echo "SGE_RABBITMQ_PASSWORD=$rabbit_password"
            echo "SGE_SQLSERVER_APP_PASSWORD=$app_sql_password"
            echo "SGE_REDIS_PASSWORD=$redis_password"
            echo "SGE_JWT_SIGNING_KEY=$jwt_key"
          } >> "$GITHUB_ENV"

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore locked dependencies
        run: dotnet restore Sistema.Gestao.Empresarial.sln --locked-mode

      - name: Verify formatting
        run: dotnet format Sistema.Gestao.Empresarial.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Sistema.Gestao.Empresarial.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test Sistema.Gestao.Empresarial.sln
          --configuration Release
          --no-build
          --no-restore
          --filter "Category!=RealInfrastructure"
          --collect "XPlat Code Coverage"
          --logger "trx"
          --results-directory TestResults

      - name: Report vulnerable dependencies
        run: dotnet list Sistema.Gestao.Empresarial.sln package --vulnerable --include-transitive

      - name: Generate idempotent migration script
        run: >-
          dotnet tool run dotnet-ef migrations script
          --idempotent
          --project src/Sistema.Gestao.Empresarial.Infrastructure
          --startup-project src/Sistema.Gestao.Empresarial.Infrastructure
          --context AppDbContext
          --configuration Release
          --no-build
          --output artifacts/migrations.sql

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet

      - name: Build container images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Scan API image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sistema-gestao-empresarial-api:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Worker image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sistema-gestao-empresarial-worker:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Nginx image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sistema-gestao-empresarial-nginx:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Prepare security artifacts
        run: mkdir -p artifacts/sbom

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: artifacts/sbom/backend.cdx.json

      - name: Start real integration dependencies
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.ci.yml
          up -d --wait
          sqlserver redis rabbitmq

      - name: Test with SQL Server, Redis and RabbitMQ
        shell: bash
        run: |
          SGE_REAL_INFRASTRUCTURE_TESTS=true \
          SGE_TEST_SQLSERVER="Server=localhost,1433;Database=master;User Id=sa;Password=${SGE_SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True" \
          SGE_TEST_REDIS="localhost:6379,user=${SGE_REDIS_USERNAME},password=${SGE_REDIS_PASSWORD},abortConnect=false" \
          SGE_TEST_RABBITMQ_HOST="localhost" \
          SGE_TEST_RABBITMQ_PORT="5672" \
          SGE_TEST_RABBITMQ_USERNAME="${SGE_RABBITMQ_USERNAME}" \
          SGE_TEST_RABBITMQ_PASSWORD="${SGE_RABBITMQ_PASSWORD}" \
          SGE_TEST_RABBITMQ_VIRTUAL_HOST="/sge" \
          dotnet test tests/Sistema.Gestao.Empresarial.IntegrationTests \
            --configuration Release \
            --no-build \
            --no-restore \
            --filter "Category=RealInfrastructure" \
            --collect "XPlat Code Coverage" \
            --logger "trx;LogFileName=real-infrastructure.trx" \
            --results-directory TestResults/RealInfrastructure

      - name: Apply migrations to application database
        shell: bash
        run: |
          SGE_DESIGNTIME_SQLSERVER="Server=localhost,1433;Database=SistemaGestaoEmpresarial;User Id=sa;Password=${SGE_SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True" \
          dotnet tool run dotnet-ef database update \
            --project src/Sistema.Gestao.Empresarial.Infrastructure \
            --startup-project src/Sistema.Gestao.Empresarial.Infrastructure \
            --context AppDbContext \
            --configuration Release \
            --no-build

      - name: Start application stack behind Nginx
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.ci.yml
          up -d --wait
          api worker nginx

      - name: Smoke test HTTPS proxy
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            exec -T nginx \
            sh -ec 'wget --no-check-certificate --quiet --output-document=- \
              --header="Host: ${NGINX_SERVER_NAME}" \
              https://127.0.0.1:8443/nginx-health'

      - name: Stop application stack
        if: always()
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.ci.yml
          down --volumes --remove-orphans

      - name: Upload test and migration artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-ci-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            artifacts/migrations.sql
            artifacts/sbom/backend.cdx.json
