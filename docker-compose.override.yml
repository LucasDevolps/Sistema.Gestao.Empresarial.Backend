services:
  api:
    environment:
      DOTNET_ENVIRONMENT: Development

  worker:
    environment:
      DOTNET_ENVIRONMENT: Development

  nginx:
    environment:
      NGINX_GENERATE_SELF_SIGNED_CERTIFICATE: "true"
    ports:
      # Desenvolvimento local: acesso pelo localhost do WSL e do Windows.
      - "127.0.0.1:${SGE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SGE_HTTPS_PORT:-8443}:8443"

  otel-collector:
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --config=/etc/otelcol-contrib/aspire.yaml
    environment:
      SGE_ASPIRE_OTLP_API_KEY: ${SGE_ASPIRE_OTLP_API_KEY:?Defina SGE_ASPIRE_OTLP_API_KEY}
    volumes:
      - ./deploy/otel-collector-aspire.yml:/etc/otelcol-contrib/aspire.yaml:ro
    depends_on:
      aspire-dashboard:
        # A imagem distroless não inclui cliente HTTP para healthcheck.
        # O exporter OTLP mantém fila/retry durante o startup do Dashboard.
        condition: service_started

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2@sha256:eb1ae1653f83dbdb9e902d903bfad620d0da859b1ea46939844989a56c9f3943
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: BrowserToken
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: ${SGE_ASPIRE_OTLP_API_KEY:?Defina SGE_ASPIRE_OTLP_API_KEY}
    ports:
      - "127.0.0.1:18888:18888"
    expose:
      - "18889"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks:
      - default
      - dashboard-access

networks:
  # Uma bridge não interna é necessária para o NAT da porta em loopback.
  # Somente o Dashboard participa; Collector e dados continuam na rede interna.
  dashboard-access:
