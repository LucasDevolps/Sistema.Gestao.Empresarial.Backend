services:
  nginx:
    environment:
      NGINX_GENERATE_SELF_SIGNED_CERTIFICATE: "true"

  sqlserver:
    ports:
      - "127.0.0.1:1433:1433"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"

# A rede padrão permanece interna no Compose base. No CI, os testes são
# executados no host do runner e precisam alcançar somente as portas publicadas
# em loopback acima; sem a saída da rede, o NAT do Docker não encaminha essas
# conexões para os containers.
networks:
  default:
    internal: false
